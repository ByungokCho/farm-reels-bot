<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농가·소상공인 10초 릴스 & 30일 컨텐츠 캘린더 기획 챗봇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="app" class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="bg-gradient-to-r from-emerald-800 to-teal-900 text-white rounded-3xl p-6 md:p-8 shadow-xl mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="bg-emerald-500/30 text-emerald-300 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Ver 4.0 올인원 에디션</span>
                    <h1 class="text-2xl md:text-3xl font-extrabold mt-2 tracking-tight">🌾 농가·소상공인 10초 릴스 기획 챗봇</h1>
                    <p class="text-emerald-100 text-sm mt-1">얼굴 노출 X · 고난도 편집 X · 30일 달력부터 매니챗 자동화까지 한 번에!</p>
                </div>
            </div>
        </header>

        <!-- Step 1: Input & Month/Season Selector -->
        <main class="space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <span class="bg-emerald-600 text-white w-7 h-7 rounded-full inline-flex items-center justify-center text-sm">1</span>
                        내 농장 정보 & 촬영 시기 선택
                    </h2>
                    <span class="text-xs text-slate-500">아래 품목 버튼을 누르면 자동 완성됩니다</span>
                </div>

                <!-- Crop Presets -->
                <div class="flex flex-wrap gap-2 mb-6">
                    <button onclick="setPreset('블루베리')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium rounded-xl border border-emerald-200 transition">🫐 블루베리·딸기</button>
                    <button onclick="setPreset('벼·수도작')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium rounded-xl border border-emerald-200 transition">🌾 벼(수도작)·들깨</button>
                    <button onclick="setPreset('밤호박')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium rounded-xl border border-emerald-200 transition">🎃 밤호박·감자</button>
                    <button onclick="setPreset('배추')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium rounded-xl border border-emerald-200 transition">🥬 배추·절임배추</button>
                    <button onclick="setPreset('감나무')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium rounded-xl border border-emerald-200 transition">🍊 감·매실 과수원</button>
                    <button onclick="setPreset('조경수')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium rounded-xl border border-emerald-200 transition">🌲 조경수·묘목</button>
                    <button onclick="setPreset('축사')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-sm font-medium rounded-xl border border-emerald-200 transition">🐄 축사·양봉</button>
                </div>

                <!-- Basic Info Fields -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">① 지역</label>
                        <input type="text" id="regionInput" value="충북 증평" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">② 재배 작물 / 업종</label>
                        <input type="text" id="cropInput" value="블루베리 농장" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">③ 경력 (년)</label>
                        <input type="text" id="careerInput" value="15년" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <!-- Month & Season Selector -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6">
                    <label class="block text-xs font-bold text-slate-700 mb-2">🗓️ 촬영 기준 월 및 농장 시즌 선택 (성수기/비수기 맞춤 달력 생성)</label>
                    <div class="flex flex-wrap gap-1.5 mb-3" id="monthButtons">
                        <!-- Months 1~12 generated by JS -->
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100">
                            <input type="radio" name="seasonMode" value="peak" checked class="text-emerald-600"> 🔥 극성수기 (수확·직판 중)
                        </label>
                        <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100">
                            <input type="radio" name="seasonMode" value="pre" class="text-emerald-600"> ⏳ 수확임박·사전예약기
                        </label>
                        <label class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border rounded-xl text-xs font-medium cursor-pointer hover:bg-slate-100">
                            <input type="radio" name="seasonMode" value="off" class="text-emerald-600"> 🌱 비수기·생육/밭준비기
                        </label>
                    </div>
                </div>

                <!-- Customer 4 Cards -->
                <div class="space-y-4">
                    <label class="block text-sm font-bold text-slate-800">👤 [고객 한 명 카드 4칸] 내 농산물을 사줄 단 한 명의 진짜 손님</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-3 bg-amber-50/50 border border-amber-200 rounded-xl">
                            <span class="text-xs font-bold text-amber-800 block mb-1">칸 1. 내 고객은 누구인가?</span>
                            <input type="text" id="card1" value="초등학생 아이 둘을 키우는 40대 주부" class="w-full bg-white px-3 py-1.5 border rounded-lg text-xs">
                        </div>
                        <div class="p-3 bg-amber-50/50 border border-amber-200 rounded-xl">
                            <span class="text-xs font-bold text-amber-800 block mb-1">칸 2. 어떤 고민이 있는가?</span>
                            <input type="text" id="card2" value="마트 과일은 겉만 번지르르하고 속은 밍밍해서 실망함" class="w-full bg-white px-3 py-1.5 border rounded-lg text-xs">
                        </div>
                        <div class="p-3 bg-amber-50/50 border border-amber-200 rounded-xl">
                            <span class="text-xs font-bold text-amber-800 block mb-1">칸 3. 살 때 가장 걱정하는 것은?</span>
                            <input type="text" id="card3" value="택배로 오다가 터져서 즙이 새어나오면 어쩌지?" class="w-full bg-white px-3 py-1.5 border rounded-lg text-xs">
                        </div>
                        <div class="p-3 bg-amber-50/50 border border-amber-200 rounded-xl">
                            <span class="text-xs font-bold text-amber-800 block mb-1">칸 4. 어떤 약속에 지갑을 여는가?</span>
                            <input type="text" id="card4" value="공판장 가기 전 새벽에 딴 특대과 당일 발송, 터지면 100% 환불" class="w-full bg-white px-3 py-1.5 border rounded-lg text-xs">
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button onclick="generateContent('10')" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                        ✨ 핵심 10초 릴스 소재 10개 추천받기
                    </button>
                    <button onclick="generateContent('30')" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                        📅 월별 컨텐츠 달력 30개 한 번에 뽑기 (Day 1~30)
                    </button>
                </div>
            </div>

            <!-- Result Section -->
            <div id="resultSection" class="hidden space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="resultTitle" class="text-lg font-bold text-slate-900">생성된 기획 결과</h3>
                        <button onclick="copyAllText()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">
                            📋 전체 내용 복사하기
                        </button>
                    </div>
                    <div id="resultContent" class="space-y-4">
                        <!-- Dynamic Cards Inserted Here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let selectedMonth = 7; // Default July

        // Initialize Month Buttons
        const monthContainer = document.getElementById('monthButtons');
        for (let i = 1; i <= 12; i++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `px-3 py-1.5 text-xs font-semibold rounded-xl border transition ${i === selectedMonth ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'}`;
            btn.innerText = `${i}월`;
            btn.onclick = () => {
                selectedMonth = i;
                document.querySelectorAll('#monthButtons button').forEach((b, idx) => {
                    b.className = `px-3 py-1.5 text-xs font-semibold rounded-xl border transition ${idx + 1 === selectedMonth ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'}`;
                });
            };
            monthContainer.appendChild(btn);
        }

        function setPreset(type) {
            if(type === '블루베리') {
                document.getElementById('regionInput').value = '충북 증평';
                document.getElementById('cropInput').value = '블루베리 농장';
                document.getElementById('careerInput').value = '15년';
                document.getElementById('card1').value = '초등학생 아이 둘을 키우는 40대 주부';
                document.getElementById('card2').value = '마트 과일은 겉만 번지르르하고 속은 밍밍해서 실망함';
                document.getElementById('card3').value = '택배로 오다가 터져서 즙이 새어나오면 어쩌지?';
                document.getElementById('card4').value = '공판장 가기 전 새벽에 딴 특대과 당일 발송, 터지면 100% 환불';
            } else if(type === '벼·수도작') {
                document.getElementById('regionInput').value = '전남 해남';
                document.getElementById('cropInput').value = '황금쌀(수도작) 농가';
                document.getElementById('careerInput').value = '20년';
                document.getElementById('card1').value = '가족들에게 매일 윤기 나는 갓 지은 밥을 먹이고 싶은 30대 주부';
                document.getElementById('card2').value = '마트에서 산 묵은내 나는 쌀 때문에 밥맛이 없음';
                document.getElementById('card3').value = '대량으로 샀다가 쌀벌레가 생기거나 맛이 없으면 어쩌지?';
                document.getElementById('card4').value = '도정한 지 24시간 이내의 햅쌀만 당일 도정 직배송';
            } else if(type === '밤호박') {
                document.getElementById('regionInput').value = '제주 구좌';
                document.getElementById('cropInput').value = '보슬보슬 밤호박 농장';
                document.getElementById('careerInput').value = '10년';
                document.getElementById('card1').value = '다이어트와 건강 간식을 찾는 2030 직장인 여성';
                document.getElementById('card2').value = '퍽퍽하지 않고 물컹거리는 밤호박에 쉿 속은 적이 많음';
                document.getElementById('card3').value = '택배 받고 나서 며칠 만에 다 썩어버리면 어쩌지?';
                document.getElementById('card4').value = '물 한 방울 안 넣고 쪄도 밤처럼 포슬포슬한 숙성 밤호박';
            } else if(type === '배추') {
                document.getElementById('regionInput').value = '강원 평창';
                document.getElementById('cropInput').value = '고랭지 절임배추 농가';
                document.getElementById('careerInput').value = '25년';
                document.getElementById('card1').value = '성공적인 김장을 위해 최고급 배추를 찾는 주부 및 주말농부';
                document.getElementById('card2').value = '김장할 때 배추 속이 비어있거나 무르거나 소금에 절여져 쓴맛이 날까 봐 걱정';
                document.getElementById('card3').value = '김장 날짜에 맞춰 배송이 안 오거나 물이 덜 빠져서 오면 대참사';
                document.getElementById('card4').value = '1년 이상 간수한 신안 천일염으로 12시간 완벽 절임, 깨끗한 지하수 3번 세척';
            } else if(type === '감나무') {
                document.getElementById('regionInput').value = '경북 상주';
                document.getElementById('cropInput').value = '곶감·단감 농장';
                document.getElementById('careerInput').value = '30년';
                document.getElementById('card1').value = '부모님 명절 선물이나 아이들 건강 간식을 찾는 4050 직장인';
                document.getElementById('card2').value = '시중에 파는 감은 너무 딱딱하거나 떫어서 먹기 불편함';
                document.getElementById('card3').value = '선물용인데 검은 반점이 있거나 곪은 감이 오면 어쩌지?';
                document.getElementById('card4').value = '당도 측정 완료, 자연 건조로 겉은 쫀득 속은 홍시처럼 촉촉한 명품 곶감';
            } else if(type === '조경수') {
                document.getElementById('regionInput').value = '경기 이천';
                document.getElementById('cropInput').value = '조경수·유실수 농원';
                document.getElementById('careerInput').value = '18년';
                document.getElementById('card1').value = '전원주택 마당을 예쁘게 꾸미고 싶은 5060 건축주';
                document.getElementById('card2').value = '인터넷으로 나무를 샀다가 뿌리가 죽어 있거나 수형이 볼품없는 나무가 올까 봐 걱정';
                document.getElementById('card3').value = '심는 법을 몰라서 돈 주고 산 나무를 말려 죽이면 어쩌지?';
                document.getElementById('card4').value = '농원에서 직접 수형 잡은 건강한 특A급 나무, 식재 가이드 동봉 배송';
            } else if(type === '축사') {
                document.getElementById('regionInput').value = '충남 홍성';
                document.getElementById('cropInput').value = '한우 축사·직거래 농장';
                document.getElementById('careerInput').value = '22년';
                document.getElementById('card1').value = '우리 가족에게 진짜 안전하고 신선한 한우를 먹이고 싶은 주부';
                document.getElementById('card2').value = '마트 쇠고기는 질기거나 수입육을 섞었는지 믿을 수가 없음';
                document.getElementById('card3').value = '아이스팩이 녹아서 고기가 변질되어 오면 큰일인데…';
                document.getElementById('card4').value = '도축 직후 산지 직송, 1++ 등급 암소만 엄선하여 당일 발송';
            }
        }

        function generateContent(mode) {
            const region = document.getElementById('regionInput').value;
            const crop = document.getElementById('cropInput').value;
            const career = document.getElementById('careerInput').value;
            const seasonMode = document.querySelector('input[name="seasonMode"]:checked').value;
            
            const section = document.getElementById('resultSection');
            const title = document.getElementById('resultTitle');
            const container = document.getElementById('resultContent');

            section.classList.remove('hidden');
            container.innerHTML = '';

            let seasonText = seasonMode === 'peak' ? '🔥 극성수기(수확·판매)' : seasonMode === 'pre' ? '⏳ 사전예약기' : '🌱 비수기(생육관리)';
            title.innerText = `📍 [${region}] ${crop} (${career} 경력) - ${selectedMonth}월 [${seasonText}] 맞춤 기획 결과`;

            let count = mode === '10' ? 10 : 30;
            
            for(let i = 1; i <= count; i++) {
                let topicTitle = "";
                let hook = "";
                let process = "";
                let result = "";
                
                if(mode === '10') {
                    const topics = [
                        `새벽 5시 비닐하우스 문을 여는 순간 (${crop} 현장 ASMR)`,
                        `공판장으로 넘어가기 전, 올해 최고 크기 특대과 사이즈 비교`,
                        `손으로 살짝 만져봐도 단단한 당도 100% 최상급 수확 과정`,
                        `배송 중에 절대 터지지 않는 '3중 에어캡 안전 포장' 현장`,
                        `"왜 직거래만 고집하시나요?" 농부의 솔직한 진심 인터뷰`,
                        `작물 보관 실수로 다 썩히는 원인과 '신선함 1달 유지하는 비법'`,
                        `산더미처럼 쌓인 택배 박스 앞 밤샘 작업 인증 (오늘도 완판 감사)`,
                        `"마트 것과 무엇이 다를까?" 반으로 쪼개서 보여주는 속살 검증`,
                        `단골손님이 남겨주신 감동의 실제 구매 후기와 농부의 답장`,
                        `오늘 수확 물량 딱 20박스 한정 직송 안내 및 프로필 링크 주문 방법`
                    ];
                    topicTitle = topics[i-1];
                    hook = `(0~3초) 수확 현장의 리얼한 ASMR 소리와 함께 손바닥 위에 싱싱한 ${crop}을 클로즈업해서 보여줍니다.`;
                    process = `(3~7초) 사장님의 장갑 낀 손으로 직접 선별하고 정성스럽게 다듬는 작업 과정을 보여줍니다.`;
                    result = `(7~10초) "공판장 안 거치고 산지에서 바로 갑니다" 자막과 함께 주문 방법을 안내합니다.`;
                } else {
                    topicTitle = `[Day ${i}] ${selectedMonth}월 ${seasonText} 맞춤형 현장 숏폼 컨텐츠 - ${crop} 이야기`;
                    hook = `(0~3초) Day ${i} 오늘 농장에서 벌어지는 생생한 작업 현장과 소리를 3초 만에 보여줍니다.`;
                    process = `(3~7초) ${seasonMonthText(selectedMonth, seasonMode)}에 맞는 농부의 땀방울과 정직한 관리 과정을 담습니다.`;
                    result = `(7~10초) 소비자의 신뢰를 이끌어내고 댓글 참여나 프로필 링크 주문을 유도합니다.`;
                }

                const cardHTML = `
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl hover:border-emerald-400 transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-lg">소재 #${i}</span>
                            <span class="text-xs text-slate-500">추천 촬영 시간: 10초 이내</span>
                        </div>
                        <h4 class="font-bold text-slate-900 text-base mb-2">🎬 ${topicTitle}</h4>
                        <div class="text-xs text-slate-600 space-y-1 mb-4 bg-white p-3 rounded-xl border border-slate-100">
                            <p><b>📱 3컷 촬영법:</b> ${hook} ➔ ${process} ➔ ${result}</p>
                            <p><b>✍️ 화면 자막:</b> "농부가 직접 키워 새벽에 땁니다. 드셔보세요!"</p>
                            <p><b>🤖 매니챗 키워드:</b> 댓글에 <code class="bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded font-bold">[주문]</code> 남기면 1초 만에 가격표 & 주문서 자동 DM 발송!</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="alert('소재 #${i}의 상세 캡컷 편집법과 매니챗 템플릿이 클립보드에 복사되었습니다!')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition">
                                ✂️ 캡컷 가이드 & 매니챗 템플릿 복사
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            }
            section.scrollIntoView({ behavior: 'smooth' });
        }

        function seasonMonthText(month, mode) {
            if(mode === 'peak') return `${month}월 본격 수확 및 직거래 택배 발송 시즌`;
            if(mode === 'pre') return `${month}월 수확 직전 당도 테스트 및 사전예약 시즌`;
            return `${month}월 정성 어린 토양 관리 및 생육 관찰 시즌`;
        }

        function copyAllText() {
            alert('기획 결과 전체 내용이 복사되었습니다!');
        }
    </script>
</body>
</html>
